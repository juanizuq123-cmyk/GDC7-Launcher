name: Publish GDC7 profile

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gdc7-pages-stable
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'gdc7-profile-')
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GDC7_PROFILE_SIGNING_KEY: ${{ secrets.GDC7_PROFILE_SIGNING_KEY }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout current publisher
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Check release and secret
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^gdc7-profile-(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z.-]+)?$') { throw 'El tag no tiene el formato gdc7-profile-<semver>.' }
          if ([string]::IsNullOrWhiteSpace($env:GDC7_PROFILE_SIGNING_KEY)) { throw 'Falta el secreto GDC7_PROFILE_SIGNING_KEY.' }
          gh release download $tag --pattern 'profile-input.zip' --dir work/profile-input
          Expand-Archive -LiteralPath 'work/profile-input/profile-input.zip' -DestinationPath 'work/profile-input/extracted' -Force
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify, sign, and prepare immutable profile assets
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^gdc7-profile-', ''
          npm run prepare:profile-release -- --input work/profile-input/extracted --version $version --output "dist/profile-$version"
      - name: Upload verified assets and advance stable pointer
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $version = $tag -replace '^gdc7-profile-', ''
          $output = "dist/profile-$version"
          Get-ChildItem "$output/assets" -File | ForEach-Object { gh release upload $tag $_.FullName }
          gh release upload $tag "$output/manifest.json" "$output/audit.json" "$output/sha256sums.txt"
          gh release delete-asset $tag profile-input.zip --yes
      - name: Checkout Pages source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: site-repo
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit and deploy profile channel
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          $version = $tag -replace '^gdc7-profile-', ''
          $site = 'site-repo/site/channels/gdc7'
          New-Item -ItemType Directory -Force -Path $site | Out-Null
          Copy-Item "dist/profile-$version/manifest.json" "$site/stable.json" -Force
          Push-Location site-repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/channels/gdc7/stable.json
          if (-not (git diff --cached --quiet)) { git commit -m "Publish GDC7 profile channel $version"; git push origin "HEAD:$env:DEFAULT_BRANCH" }
          Pop-Location
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-repo/site
      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        id: deployment
        environment:
          name: github-pages
          url: ${{ steps.deployment.outputs.page_url }}
